name: Internal alpha mobile smoke

# 실제 Android Emulator와 iOS Simulator를 사용하는 유료 작업이므로 PR마다 자동 실행하지 않는다.
# EAS 프로젝트 연결 후 `eas workflow:run .eas/workflows/mobile-smoke.yml`로 명시적으로 실행한다.
jobs:
  build_android:
    name: Build Android smoke app
    type: build
    params:
      platform: android
      profile: e2e-test

  build_ios:
    name: Build iOS smoke app
    type: build
    params:
      platform: ios
      profile: e2e-test

  test_android:
    name: Run Android internal alpha journey
    needs: [build_android]
    type: maestro
    environment: development
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: .maestro/internal-alpha-smoke.yml

  test_ios:
    name: Run iOS internal alpha journey
    needs: [build_ios]
    type: maestro
    environment: development
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path: .maestro/internal-alpha-smoke.yml
